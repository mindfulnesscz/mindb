name: Check

on:
  pull_request:
  push:
    branches: [main, staging, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Required for compiling the Tauri crate on Linux (clippy builds it).
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm run setup
      # Explicit step so a lint failure is obvious in the job summary; `npm run
      # check` runs it again as part of the composite gate used locally.
      - name: Lint
        run: npm run lint
      - run: npm run check
      # Root `test` runs the shared-package suites then the desktop suite, with the coverage
      # ratchet applied. The thresholds sit just under today's numbers, so this fails only when
      # coverage goes DOWN — see the note in vitest.config.ts for why a red-on-day-one gate is
      # worse than none.
      - name: Tests + coverage ratchet
        run: npm run test:coverage
      # Pure Rust helpers: SigV4 date math, URI encoding, OAuth authority resolution.
      - name: Rust tests
        run: npm run test:rust
      # Explicit step so a clippy failure is attributable at a glance; `npm run check`
      # runs it too, as the composite gate used locally.
      - name: Rust lint
        run: npm run lint:rust
