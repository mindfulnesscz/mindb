name: Desktop release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # Root workspace + docs (docs has its own lockfile; see `npm run setup`).
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `npm run check` ends in `lint:rust` (clippy). Same gate as check.yml.
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Bundled render engines — see the same step in check.yml. These are nested executable code:
      # once signing is turned on they must be fetched and placed BEFORE the app is signed, and the
      # bundle must not be modified afterwards.
      - name: Cache native engines
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/resources/native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-native-deps.mjs') }}
      # Must install the whole workspace at the repo root. A desktop-only `npm ci`
      # leaves root `.bin` empty, so `eslint` / other check scripts exit 127.
      - run: npm run setup
      - run: npm run check
      - run: npm run version:check
      # Unsigned and un-notarized. Gatekeeper refuses it on download, and "right-click → Open" is no
      # longer reliable on current macOS — the route is System Settings → Privacy & Security → Open
      # Anyway, or `xattr -dr com.apple.quarantine "/Applications/Sotto.app"`.
      # Also ARM-ONLY: macos-latest runners are Apple Silicon and `"targets": "all"` selects bundle
      # FORMATS, not architectures, so this .dmg does not run on an Intel Mac.
      # For signed builds, set TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
      #
      # AUTO-UPDATE IS OFF, and turning it on is four steps, not one. The old note here said "set
      # UPDATER_PUBKEY", which understated it — the config that was there held a Supabase
      # publishable key in the `pubkey` field and pointed at a `latest.json` this workflow never
      # produced, so it looked configured and could never work. To enable:
      #   1. `npx tauri signer generate` — private key + password into repo secrets
      #   2. restore `plugins.updater` (pubkey + endpoints) in tauri.conf.json
      #   3. restore the `tauri_plugin_updater` registration in src-tauri/src/lib.rs
      #   4. emit and upload the updater artifacts, so the endpoint actually resolves
      # MUST be `build:app`, not `tauri build`. Tauri's bundle.resources dereferences symlinks, which
      # inflates LibreOffice.app from ~800MB to 1.5GB and breaks its sealed signature, so LibreOffice
      # is excluded from bundle.resources and placed with `ditto` by this script — after the app is
      # built, before anything is signed. A bare `tauri build` produces a bundle with NO LibreOffice,
      # which silently falls back to a host install on the runner and fails on a user's machine.
      # See docs/pages/reference/third-party-engines.mdx.
      - run: npm run build:app
      - name: Publish release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          draft: true   # review release notes, then publish manually
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
