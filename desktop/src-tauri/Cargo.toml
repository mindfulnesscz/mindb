[package]
name = "sotto-app"
version = "3.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sotto_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Optimise DEPENDENCIES even in debug builds. Our own crate stays unoptimised, so incremental
# builds and debugging are unaffected.
#
# This is not a nicety. Thumbnailing used to shell out to `cwebp`, an optimised binary, so the build
# profile was irrelevant. Now the decode/resize/encode work happens in Rust, and unoptimised it is
# catastrophic: an 8000x4500 JPEG took 21s in debug against 0.28s for `cwebp` — a ~75x regression
# that made `tauri dev` unusable for real runs. With this, debug matches release on the hot path.
# Cost is a one-time slower first build of the dependency graph.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
sha2 = "0.10"
md-5 = "0.11"
hmac = "0.12"
hex = "0.4"
keyring = "4.1.6"
tokio = { version = "1", features = ["net", "io-util", "time", "fs"] }
# Thumbnail rendering, all in-process. `image` decodes rasters; `webp` is libwebp built from
# vendored C and STATICALLY linked (verified: no libwebp in `otool -L`), replacing the `cwebp`
# binary. `pdfium-render` binds the bundled PDFium dynamic library, replacing `pdftoppm`.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp"] }
webp = "0.3"
# `thread_safe` serialises calls into PDFium, which is NOT thread-safe and keeps process-global
# state (FPDF_InitLibrary/FPDF_DestroyLibrary). The pipeline renders 8 files at once, so without
# this — plus the single process-wide instance in `render` — concurrent thumbnails segfault.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
