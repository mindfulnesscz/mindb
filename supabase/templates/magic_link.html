<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f7f6f2;color:#161616;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;background:#fff;border:1px solid #161616;padding:28px">
      <p style="margin:0 0 22px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">
        Sotto
      </p>
      <h1 style="margin:0 0 12px;font-size:24px;font-weight:500">Sign in to Sotto</h1>
      <p style="margin:0 0 22px;font-size:14px;line-height:1.5;color:#595959">
        Continue to a secure confirmation page to finish signing in.
      </p>
      <p style="margin:0 0 22px">
        <a
          href="{{ .SiteURL }}/auth/confirm#token_hash={{ .TokenHash }}&amp;redirect_to={{ .RedirectTo }}"
          style="display:inline-block;padding:11px 18px;background:#161616;color:#fff;text-decoration:none;font-size:14px;font-weight:700"
        >Continue to Sotto</a>
      </p>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#777">
        This link expires in one hour. If you did not request it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
